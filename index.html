<!DOCTYPE html>
<html lang="fr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaîne de Prière 24/7</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK Client Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

  <!-- EN-TÊTE DE NAVIGATION -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40 shadow-sm px-4 py-3 flex items-center justify-between">
    <button onclick="navigate(null)" id="btn-accueil" class="px-3 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white">
      🏠 Accueil
    </button>
    <nav id="nav-users" class="flex space-x-1 overflow-x-auto mx-2"></nav>
    <div class="flex items-center space-x-3">
      <button onclick="toggleDarkMode()" id="btn-theme" title="Changer le thème" class="p-2 rounded-lg text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
        🌙
      </button>
      <span id="user-badge" class="text-sm font-bold text-slate-700 dark:text-slate-200">---</span>
      <button onclick="logout()" class="text-xs bg-red-50 dark:bg-red-950 text-red-600 dark:text-red-400 px-2 py-1 rounded hover:bg-red-100 dark:hover:bg-red-900">Quitter</button>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main id="main-content" class="max-w-5xl mx-auto w-full p-6 space-y-6 flex-1"></main>

  <!-- MODAL IDENTIFICATION -->
  <div id="modal-user" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6 text-center border border-slate-200 dark:border-slate-700">
      <h2 class="text-2xl font-bold text-slate-800 dark:text-white mb-2">Bienvenue sur la Chaîne</h2>
      <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Choisissez votre prénom pour vous identifier :</p>
      <div id="user-grid" class="grid grid-cols-2 gap-2"></div>
    </div>
  </div>

  <!-- MODAL RHÉMA (LECTURE & ÉCRITURE) -->
  <div id="modal-rhema" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h3 id="rhema-user" class="text-xl font-bold text-slate-800 dark:text-white">---</h3>
          <p id="rhema-time" class="text-xs text-slate-400 dark:text-slate-400">---</p>
        </div>
        <button onclick="closeRhemaModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold">✕</button>
      </div>
      <div id="rhema-body"></div>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const USERS = ['Suzanne', 'Youyou', 'Douglas', 'Yvette', 'Guyguy', 'Dauraly', 'Christelle', 'Albert'];
    const START_DATE = new Date('2026-08-18T00:00:00');
    const TOTAL_DAYS = 14;

    // --- CONFIGURATION SUPABASE ---
    const SUPABASE_URL = "https://gqijftvwpueosbwebfte.supabase.co";
    const SUPABASE_KEY = "sb_publishable__oTENxwr7tFLvKkOUqh3iA_MfhVHoPa";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = localStorage.getItem('chain_user') || null;
    let selectedUserView = null;
    let selectedSlotId = null;
    let rhemas = {};
    let isDarkMode = localStorage.getItem('chain_theme') === 'dark';

    // --- GÉNÉRATION D'AGENDA ET ALARMES (iOS & Android) ---
    function formatICSDate(date) {
      return date.toISOString().replace(/-|:|\.\d+/g, '');
    }

    function exportToCalendar(platform, userName) {
      const targetUser = userName || currentUser;
      if (!targetUser) return;

      const now = new Date();
      const allSlots = getAllSlots(now);
      const userSlots = allSlots.filter(s => s.assignedUser === targetUser);

      if (userSlots.length === 0) {
        alert("Aucun créneau à exporter pour cet utilisateur.");
        return;
      }

      let icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Chaine de Priere 24/7//FR',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH'
      ];

      userSlots.forEach((slot) => {
        const startStr = formatICSDate(slot.startTime);
        const endStr = formatICSDate(slot.endTime);

        icsContent.push(
          'BEGIN:VEVENT',
          `UID:slot-${slot.slotId}@chainedepriere.com`,
          `DTSTAMP:${formatICSDate(new Date())}`,
          `DTSTART:${startStr}`,
          `DTEND:${endStr}`,
          `SUMMARY:🙏 Tour de Prière - ${slot.assignedUser}`,
          `DESCRIPTION:Créneau de prière de 3h. N'oubliez pas de vous connecter à la chaîne de prière.`,
          'BEGIN:VALARM',
          'TRIGGER:-PT15M',
          'ACTION:DISPLAY',
          'DESCRIPTION:Rappel : 15 min avant votre tour de prière',
          'END:VALARM',
          'BEGIN:VALARM',
          'TRIGGER:-PT5M',
          'ACTION:DISPLAY',
          'DESCRIPTION:Rappel : 5 min avant votre tour de prière',
          'END:VALARM',
          'END:VEVENT'
        );
      });

      icsContent.push('END:VCALENDAR');

      const calendarData = icsContent.join('\r\n');
      const blob = new Blob([calendarData], { type: 'text/calendar;charset=utf-8' });
      const fileURL = window.URL.createObjectURL(blob);

      if (platform === 'ios') {
        // Redirection vers le Blob : Safari sur iPhone / iPad ouvrira le menu natif de l'app Calendrier
        window.location.href = fileURL;
      } else {
        // Téléchargement pour Android et Ordinateurs
        const a = document.createElement('a');
        a.href = fileURL;
        a.download = `Priere_${targetUser}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    // --- CHARGEMENT DES RHÉMAS DEPUIS SUPABASE ---
    async function fetchRhemas() {
      const { data, error } = await supabaseClient.from('rhemas').select('*');
      if (data && !error) {
        const mapped = {};
        data.forEach(item => { mapped[item.slot_id] = item; });
        rhemas = mapped;
        render();
      }
    }

    // --- SAUVEGARDER UN RHÉMA DANS SUPABASE ---
    async function saveRhema() {
      const text = document.getElementById('rhema-input').value;
      const { error } = await supabaseClient.from('rhemas').upsert({
        slot_id: selectedSlotId,
        text: text,
        author: currentUser,
        updated_at: new Date().toISOString()
      });

      if (!error) {
        rhemas[selectedSlotId] = { text, author: currentUser };
        closeRhemaModal();
        render();
      } else {
        alert("Erreur lors de l'enregistrement dans la base de données.");
      }
    }

    // --- INITIALISATION DU THÈME ---
    function applyTheme() {
      if (isDarkMode) {
        document.documentElement.classList.add('dark');
        document.getElementById('btn-theme').innerText = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('btn-theme').innerText = '🌙';
      }
    }

    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      localStorage.setItem('chain_theme', isDarkMode ? 'dark' : 'light');
      applyTheme();
    }

    // --- CALCUL DES CRÉNEAUX ---
    function getSlotDetails(dayIndex, slotIndex, now) {
      const startTime = new Date(START_DATE.getTime() + (dayIndex * 24 + slotIndex * 3) * 3600000);
      const endTime = new Date(startTime.getTime() + 3 * 3600000);
      
      const assignedUserIndex = (slotIndex + dayIndex) % 8;
      const assignedUser = USERS[assignedUserIndex];
      const slotId = `day_${dayIndex}_slot_${slotIndex}`;

      return {
        slotId,
        startTime,
        endTime,
        assignedUser,
        isCurrent: now >= startTime && now < endTime,
        isPast: now >= endTime,
        isFuture: now < startTime
      };
    }

    function getAllSlots(now) {
      const slots = [];
      for (let day = 0; day < TOTAL_DAYS; day++) {
        for (let slot = 0; slot < 8; slot++) {
          slots.push(getSlotDetails(day, slot, now));
        }
      }
      return slots;
    }

    function formatDuration(ms) {
      if (ms < 0) ms = 0;
      const seconds = Math.floor((ms / 1000) % 60);
      const minutes = Math.floor((ms / (1000 * 60)) % 60);
      const hours = Math.floor(ms / (1000 * 3600));
      return `${hours.toString().padStart(2, '0')}h ${minutes.toString().padStart(2, '0')}m ${seconds.toString().padStart(2, '0')}s`;
    }

    // --- GESTION UTILISATEUR ---
    function selectUser(name) {
      currentUser = name;
      localStorage.setItem('chain_user', name);
      document.getElementById('modal-user').classList.add('hidden');
      render();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('chain_user');
      document.getElementById('modal-user').classList.remove('hidden');
      renderUserModal();
    }

    function navigate(user) {
      selectedUserView = user;
      render();
    }

    // --- RHÉMA ---
    function openRhemaModal(slotId, assignedUser, timeText) {
      selectedSlotId = slotId;
      document.getElementById('rhema-user').innerText = assignedUser;
      document.getElementById('rhema-time').innerText = timeText;

      const body = document.getElementById('rhema-body');
      const isOwner = currentUser === assignedUser;
      const currentText = rhemas[slotId] ? rhemas[slotId].text : '';

      if (isOwner) {
        body.innerHTML = `
          <textarea id="rhema-input" rows="5" placeholder="Inscrivez vos versets ou impressions ici..." class="w-full p-3 border rounded-xl text-sm mb-4 border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-600">${currentText}</textarea>
          <button onclick="saveRhema()" class="w-full py-2 bg-indigo-600 text-white rounded-xl font-bold text-sm hover:bg-indigo-700">Enregistrer dans la base de données</button>
        `;
      } else {
        body.innerHTML = `
          <div class="p-4 bg-slate-50 dark:bg-slate-900/50 rounded-xl min-h-[100px] text-sm text-slate-700 dark:text-slate-200 whitespace-pre-wrap">${currentText || '<span class="text-slate-400 italic">Aucun texte consigné pour le moment.</span>'}</div>
          <p class="text-xs text-slate-400 dark:text-slate-500 mt-3 text-center">Seul(e) ${assignedUser} peut modifier ce texte.</p>
        `;
      }

      document.getElementById('modal-rhema').classList.remove('hidden');
    }

    function closeRhemaModal() {
      document.getElementById('modal-rhema').classList.add('hidden');
    }

    // --- RENDU GRAPHIQUE ---
    function renderUserModal() {
      const grid = document.getElementById('user-grid');
      grid.innerHTML = USERS.map(name => `
        <button onclick="selectUser('${name}')" class="p-3 text-sm font-semibold rounded-xl border border-slate-200 dark:border-slate-700 hover:border-indigo-600 dark:hover:border-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 text-slate-700 dark:text-slate-200">
          ${name}
        </button>
      `).join('');
    }

    function renderHeader() {
      document.getElementById('user-badge').innerText = currentUser || '---';
      
      const btnAccueil = document.getElementById('btn-accueil');
      if (selectedUserView === null) {
        btnAccueil.className = 'px-3 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white';
      } else {
        btnAccueil.className = 'px-3 py-1.5 rounded-lg text-sm font-bold bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600';
      }

      const nav = document.getElementById('nav-users');
      nav.innerHTML = USERS.map(name => `
        <button onclick="navigate('${name}')" class="px-3 py-1.5 rounded-lg text-sm font-medium ${selectedUserView === name ? 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}">
          ${name}
        </button>
      `).join('');
    }

    function render() {
      if (!currentUser) {
        document.getElementById('modal-user').classList.remove('hidden');
        renderUserModal();
        return;
      }

      renderHeader();

      const now = new Date();
      const allSlots = getAllSlots(now);
      const activeSlot = allSlots.find(s => s.isCurrent);
      const main = document.getElementById('main-content');

      if (selectedUserView === null) {
        let activeHTML = '';
        if (activeSlot) {
          activeHTML = `
            <section class="bg-indigo-900 dark:bg-indigo-950 text-white rounded-3xl p-6 shadow-xl border border-indigo-800 dark:border-indigo-900">
              <span class="text-xs text-green-400 uppercase font-bold tracking-wider">● Session En Cours</span>
              <h2 class="text-3xl font-extrabold mt-1">${activeSlot.assignedUser}</h2>
              <p class="text-indigo-200 text-sm mt-1">
                Créneau : ${activeSlot.startTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} – ${activeSlot.endTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
              </p>
              <div class="mt-4 bg-white/10 dark:bg-black/20 p-4 rounded-xl text-center">
                <span class="text-xs text-indigo-200 block">Temps écoulé</span>
                <span class="text-3xl font-mono font-bold">${formatDuration(now - activeSlot.startTime)}</span>
              </div>
              <button onclick="openRhemaModal('${activeSlot.slotId}', '${activeSlot.assignedUser}', '${activeSlot.startTime.toLocaleString()}')" class="mt-4 w-full py-2 bg-white dark:bg-slate-100 text-indigo-900 font-bold rounded-xl text-sm hover:bg-indigo-50">
                Consulter / Écrire un Rhéma
              </button>
            </section>
          `;
        } else {
          activeHTML = `<p class="text-center text-slate-500 dark:text-slate-400 py-4">Aucune session active actuellement.</p>`;
        }

        const nextSlots = allSlots.filter(s => s.isFuture).slice(0, 4);
        const nextHTML = nextSlots.map(s => `
          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <span class="text-xs font-semibold text-slate-400 dark:text-slate-500">${s.startTime.toLocaleDateString([], {weekday:'short', day:'numeric'})}</span>
            <h4 class="font-bold text-slate-800 dark:text-slate-100">${s.assignedUser}</h4>
            <p class="text-xs font-mono text-indigo-600 dark:text-indigo-400 mt-2">Débute dans : ${formatDuration(s.startTime - now)}</p>
          </div>
        `).join('');

        main.innerHTML = `
          <!-- BANNIÈRE SYNCHRONISATION AGENDA SEPARÉE IOS ET ANDROID -->
          <div class="bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <h3 class="font-bold text-indigo-900 dark:text-indigo-200 text-sm">📲 Synchroniser avec votre téléphone</h3>
              <p class="text-xs text-indigo-700 dark:text-indigo-300">Ajoutez vos créneaux de prière avec rappels automatiques (15 min et 5 min avant) dans l'agenda de votre téléphone.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
              <button onclick="exportToCalendar('ios')" class="w-full sm:w-auto text-xs bg-slate-900 text-white font-bold px-4 py-2.5 rounded-xl hover:bg-slate-800 transition whitespace-nowrap shadow-sm flex items-center justify-center gap-1.5">
                🍎 Synchroniser iPhone (iOS)
              </button>
              <button onclick="exportToCalendar('android')" class="w-full sm:w-auto text-xs bg-indigo-600 text-white font-bold px-4 py-2.5 rounded-xl hover:bg-indigo-700 transition whitespace-nowrap shadow-sm flex items-center justify-center gap-1.5">
                🤖 Synchroniser Android
              </button>
            </div>
          </div>

          ${activeHTML}
          <section>
            <h3 class="font-bold text-lg mb-3 text-slate-800 dark:text-slate-100">Prochains Relais</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">${nextHTML}</div>
          </section>
        `;
      } else {
        const userSlots = allSlots.filter(s => s.assignedUser === selectedUserView);
        const slotsHTML = userSlots.map(s => `
          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <span class="text-xs font-bold px-2 py-0.5 rounded ${s.isCurrent ? 'bg-green-100 dark:bg-green-950 text-green-700 dark:text-green-300' : s.isPast ? 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400' : 'bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300'}">
              ${s.isCurrent ? 'En cours' : s.isPast ? 'Passée' : 'À venir'}
            </span>
            <p class="font-bold mt-2 text-slate-800 dark:text-slate-100">${s.startTime.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short'})} (${s.startTime.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})})</p>
            <button onclick="openRhemaModal('${s.slotId}', '${s.assignedUser}', '${s.startTime.toLocaleString()}')" class="mt-3 text-xs bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 px-3 py-1.5 rounded-lg font-bold w-full hover:bg-indigo-100 dark:hover:bg-indigo-900">
              ${rhemas[s.slotId] ? '📖 Lire le Rhéma' : 'Ouvrir'}
            </button>
          </div>
        `).join('');

        main.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
            <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Planning de ${selectedUserView}</h2>
            <div class="flex gap-2">
              <button onclick="exportToCalendar('ios', '${selectedUserView}')" class="text-xs bg-slate-900 text-white font-bold px-3 py-2 rounded-xl hover:bg-slate-800">
                🍎 iPhone (${selectedUserView})
              </button>
              <button onclick="exportToCalendar('android', '${selectedUserView}')" class="text-xs bg-indigo-600 text-white font-bold px-3 py-2 rounded-xl hover:bg-indigo-700">
                🤖 Android (${selectedUserView})
              </button>
            </div>
          </div>
          <section>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">${slotsHTML}</div>
          </section>
        `;
      }
    }

    applyTheme();
    fetchRhemas();
    setInterval(render, 1000);
    render();
  </script>
</body>
</html>
